<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ec4913",
                        "background-light": "#f8f6f6",
                        "background-dark": "#221510",
                    },
                    fontFamily: {
                        "display": ["Epilogue", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center p-4">
<div class="max-w-6xl w-full bg-white dark:bg-stone-900 rounded-xl overflow-hidden shadow-2xl flex flex-col md:flex-row">
<!-- Image Side Panel -->
<div class="hidden md:block md:w-1/2 relative min-h-[600px]">
<div class="absolute inset-0 bg-cover bg-center" data-alt="Close up of vibrant various spices in wooden spoons" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCN9hUi4l8TkYYautLXg5nLSpjeBbL88Z1qjfO5yD-snjvJuSQxqoZviZi3deSiyvFCf8G-uRraaxqxanJ-gM3uvyVVz6xqXr-P1OLMCJr7CwGr7-kQ33d1-wJ2suNkFYgxcuWLAqZdFiAjGqpDfmQxrESX4zMXjefx0rbYh2Umhx2wpD_j-CgSw6Vse5-B24SsBRjKbXIASJ5p6odVd6EHp3kxVs0cP3k-X9NUKuPch93AQEhqLcXpq1BGn9R7tclSdYp3tImg2vFl')">
<div class="absolute inset-0 bg-primary/20 mix-blend-multiply"></div>
<div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
</div>
<div class="absolute bottom-10 left-10 right-10 text-white">
<div class="flex items-center gap-2 mb-4">
<span class="material-symbols-outlined text-primary text-4xl">local_mall</span>
<h2 class="text-3xl font-black tracking-tight">Spice Haven</h2>
</div>
<p class="text-lg font-medium opacity-90">Unlock the secret to extraordinary dishes. Sign in to your curated collection of world-class flavors.</p>
</div>
</div>
<!-- Login Form Side -->
<div class="w-full md:w-1/2 p-8 md:p-16 flex flex-col justify-center">
<div class="mb-10 md:hidden flex items-center gap-2 text-primary">
<span class="material-symbols-outlined text-3xl">local_mall</span>
<h2 class="text-xl font-bold tracking-tight text-slate-900 dark:text-slate-100">Spice Haven</h2>
</div>
<div class="mb-8">
<h1 class="text-3xl font-bold text-slate-900 dark:text-slate-100 mb-2">Welcome Back</h1>
<p class="text-slate-600 dark:text-slate-400">Please enter your details to sign in to your account.</p>
</div>
<form class="space-y-5">
<div>
<label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2" for="email">Email Address</label>
<input class="w-full px-4 py-3 rounded-lg border border-slate-200 dark:border-stone-700 bg-white dark:bg-stone-800 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all" id="email" placeholder="Enter your email" type="email"/>
</div>
<div>
<div class="flex justify-between items-center mb-2">
<label class="block text-sm font-semibold text-slate-700 dark:text-slate-300" for="password">Password</label>
<a class="text-sm font-medium text-primary hover:underline" href="#">Forgot Password?</a>
</div>
<div class="relative">
<input class="w-full px-4 py-3 rounded-lg border border-slate-200 dark:border-stone-700 bg-white dark:bg-stone-800 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all" id="password" placeholder="Enter your password" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<div class="flex items-center gap-2">
<input class="rounded border-slate-300 text-primary focus:ring-primary" id="remember" type="checkbox"/>
<label class="text-sm text-slate-600 dark:text-slate-400" for="remember">Remember me for 30 days</label>
</div>
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-3.5 rounded-lg transition-colors shadow-lg shadow-primary/20" type="submit">
                    Sign In
                </button>
</form>
<div class="mt-8">
<div class="relative flex items-center py-4">
<div class="flex-grow border-t border-slate-200 dark:border-stone-700"></div>
<span class="flex-shrink mx-4 text-slate-400 text-sm font-medium">Or continue with</span>
<div class="flex-grow border-t border-slate-200 dark:border-stone-700"></div>
</div>
<div class="grid grid-cols-2 gap-4 mt-6">
<button class="flex items-center justify-center gap-2 py-2.5 px-4 border border-slate-200 dark:border-stone-700 rounded-lg hover:bg-slate-50 dark:hover:bg-stone-800 transition-colors">
<img alt="Google logo" class="w-5 h-5" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCa78hbBP4PCSXRMdBOTEpc1MA8xtbkRrAoOoux7TfpktCWycYhZaiRFE22r9qIlB-qaN_xtmR16DfEdoeDmPbyiAM0K7AGW9J_JWtGNOsqk2rd9s-1t6mk2B48f093fT9L8fneu9ST_jXEbbxQvufrpAbkEAdawixV8_wFhkkvM9UpSIShNNTH5Ei-QmMTLscBps_pR_H9aoLuavUomfkgKz9Sy3qf5GxXDrPqjeiSls49WpZQnSAAx8PMCyBzpy4yFOU75pLHQgMu"/>
<span class="text-sm font-semibold text-slate-700 dark:text-slate-300">Google</span>
</button>
<button class="flex items-center justify-center gap-2 py-2.5 px-4 border border-slate-200 dark:border-stone-700 rounded-lg hover:bg-slate-50 dark:hover:bg-stone-800 transition-colors">
<svg class="w-5 h-5 dark:fill-white" viewbox="0 0 384 512" xmlns="http://www.w3.org/2000/svg">
<path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 21.8-88.5 21.8-11.4 0-53.8-24.3-89.8-22.8-44.6 1.9-88.7 33.7-111 74-45 81.3-11.5 201.2 32.3 264.4 21.4 30.8 47.1 65 80.5 63.8 32.3-1.3 44.4-20.9 83.5-20.9 39 0 50.3 20.9 83.9 20.2 34.3-.7 57.3-30.8 78.5-61.6 24.3-35.5 34.4-69.8 34.8-71.5-.7-.3-66.9-25.7-67.5-102.3zm-72-167.9c15.9-19.3 26.6-46 23.6-72.7-22.9 1-50.6 15.4-67 34.6-14.8 17.1-27.7 44.5-24.3 70.4 25.5 1.9 51.7-13.1 67.7-32.3z"></path>
</svg>
<span class="text-sm font-semibold text-slate-700 dark:text-slate-300">Apple</span>
</button>
</div>
</div>
<p class="mt-10 text-center text-slate-600 dark:text-slate-400 text-sm">
                New to Spice Haven? 
                <a class="text-primary font-bold hover:underline ml-1" href="#">Create an Account</a>
</p>
</div>
</div>
</body></html>
